name: publish-chart-to-harbor-registry
run-name: ${{ gitea.actor }} is testing out Gitea Push Chart 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: aaron19940628@gmail.com
  REPOSITORY_NAMESPACE: ay-dev
  CHART_NAME: data-warehouse
jobs:
  build-and-push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - chart_path: "environments/helm/metadata-environment"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "${{ env.USER }}"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Release Chart
        uses: bitdeps/helm-oci-charts-releaser@v0.1.4
        with:
          oci_registry: ghcr.io/aaronyang0628/data-warehouse-charts
          oci_username: ${{ env.USER }}
          oci_password: ${{ secrets.GIT_REGISTRY_PWD }}
          github_token: ${{ secrets.GIT_REGISTRY_PWD }}
          charts_dir: "${{ matrix.chart_path }}"
          skip_existing: false
          skip_gh_release: true