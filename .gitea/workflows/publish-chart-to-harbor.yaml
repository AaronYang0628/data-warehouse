name: publish-chart-to-harbor-registry
run-name: ${{ gitea.actor }} is testing out Gitea Push Chart 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: byang628@zhejianglab.com
  REPOSITORY_NAMESPACE: ay-dev

jobs:
  build-and-push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Package Helm chart
        run: |
          cd environments/helm/metadata-environment
          helm package .
          
      - name: Login to Harbor
        run: |
          echo "${{ secrets.ZJ_HARBOR_TOKEN }}" | helm registry login \
            ${{ env.REGISTRY }} \
            --username ${{ env.USER }} \
            --password-stdin

      - name: Push Helm chart
        run: |
          cd environments/helm/metadata-environment
          CHART_VERSION=$(helm show chart . | grep version: | cut -d' ' -f2)
          CHART_NAME=$(helm show chart . | grep name: | cut -d' ' -f2)
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}