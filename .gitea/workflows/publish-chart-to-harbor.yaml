name: publish-chart-to-harbor-registry
run-name: ${{ gitea.actor }} is testing out Gitea Push Chart 🚀
on: [push]

jobs:
  build-and-push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - chart_path: "environments/helm/metadata-environment"
    steps:
      - name: checkout-repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: chart-releaser
        uses: bitdeps/helm-oci-charts-releaser@v0.1.4
        with:
          oci_registry: oci://harbor.zhejianglab.com/ay-dev
          oci_username: byang628@zhejianglab.com
          oci_password: ${{ secrets.ZJ_HARBOR_TOKEN }}
          github_token: ${{ secrets.ZJ_HARBOR_TOKEN }}
          charts_dir: "${{ matrix.chart_path }}"
          tag_name_pattern: ${{ github.ref_type == 'tag' && '{{chartName}}-chart' || '{{chartName}}-chart-latest' }}
          skip_dependencies: false
          skip_gh_release: ${{ github.ref_type != 'tag' }}
          mark_as_latest: ${{ github.ref_type != 'tag' }}
          version: v3.17.4
