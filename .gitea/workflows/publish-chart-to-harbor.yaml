name: publish-chart-to-harbor-registry
run-name: ${{ gitea.actor }} is testing out Gitea Push Chart 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: byang628@zhejianglab.com
  REPOSITORY_NAMESPACE: ay-dev
  CHART_NAME: data-warehouse
jobs:
  build-and-push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - chart_path: "environments/helm/metadata-environment"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release Chart
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ env.CHART_NAME }}
          repository: ${{ env.REPOSITORY_NAMESPACE }}
          tag: 0.1.0
          path: environments/helm/metadata-environmen
          registry: ${{ env.REGISTRY }}
          registry_username: ${{ env.USER }}
          registry_password: ${{ secrets.ZJ_HARBOR_TOKEN }}
          update_dependencies: 'true'