run-name: ${{ gitea.actor }} is testing out Gitea Push Image 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: byang628@zhejianglab.com
  REPOSITORY_NAMESPACE: ay-dev
jobs:
  build-and-push-images:
    strategy:
      matrix:
        include:
          - name_suffix: "operator"
            container_path: "."
            dockerfile_path: "Dockerfile"
    runs-on: ubuntu-latest
    steps:
    - name: checkout-repository
      uses: actions/checkout@v4
    - name: get-current-date
      id: date
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "will push image: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}"

    # 跳过实际的镜像构建，仅执行代码验证步骤
    - name: verify-code
      run: |
        echo "Verifying code structure..."
        ls -la ${{ matrix.container_path }}
        if [ -f ${{ matrix.dockerfile_path }} ]; then
          echo "Dockerfile exists: ${{ matrix.dockerfile_path }}"
          cat ${{ matrix.dockerfile_path }} | head -10
        else
          echo "Warning: Dockerfile not found at ${{ matrix.dockerfile_path }}"
        fi
    
    # 如果您需要在其他环境中手动构建和推送，可以添加提示信息
    - name: provide-manual-instructions
      run: |
        echo "Environment restrictions prevent automated image build."
        echo "To build and push the image manually, run these commands:"
        echo ""
        echo "1. Build the image:"
        echo "docker build -t ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }} -f ${{ matrix.dockerfile_path }} ${{ matrix.container_path }}"
        echo ""
        echo "2. Login to Harbor:"
        echo "docker login ${{ env.REGISTRY }} --username ${{ env.USER }}"
        echo ""
        echo "3. Push the image:"
        echo "docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}"

    # # 安装 Podman（如果环境中没有的话）
    # - name: install-podman
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y podman
    
