name: publish-image-to-harbor-registry
run-name: ${{ gitea.actor }} is testing out Gitea Push Image 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: byang628@zhejianglab.com
  REPOSITORY_NAMESPACE: ay-dev
jobs:
  build-and-push-images:
    strategy:
      matrix:
        include:
          - name_suffix: "operator"
            container_path: "."
            dockerfile_path: "Dockerfile"
    runs-on: ubuntu-latest
    container:
      image: docker:dind-rootless
      options: --privileged
    steps:
    - name: Install dependencies
      run: |
        apk add --no-cache nodejs npm git
    - name: checkout-repository
      uses: actions/checkout@v4
    - name: start-docker-daemon
      run: |
        dockerd-entrypoint.sh &
        sleep 5
        docker info
    - name: setup-docker-buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
    - name: get-current-date
      id: date
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "will push image: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}"
    - name: login-to-the-container-registry
      uses: docker/login-action@v3
      with:
        registry: "${{ env.REGISTRY }}"
        username: "${{ env.USER }}"
        password: "${{ secrets.HARBOR_REGISTRY_PWD }}"
    - name: build-and-push-container-image
      uses: docker/build-push-action@v6
      with:
        context: "${{ matrix.container_path }}"
        file: "${{ matrix.dockerfile_path }}"
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}