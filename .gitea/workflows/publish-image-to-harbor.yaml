run-name: ${{ gitea.actor }} is testing out Gitea Push Image 🚀
on: [push]

env:
  REGISTRY: harbor.zhejianglab.com
  USER: byang628@zhejianglab.com
  REPOSITORY_NAMESPACE: ay-dev
jobs:
  build-and-push-images:
    strategy:
      matrix:
        include:
          - name_suffix: "operator"
            container_path: "."
            dockerfile_path: "Dockerfile"
    runs-on: ubuntu-latest
    steps:
    - name: checkout-repository
      uses: actions/checkout@v4
    - name: get-current-date
      id: date
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "will push image: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}"
    
    # 安装 Podman（如果环境中没有的话）
    - name: install-podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman
    
    # 使用 Podman 构建镜像
    - name: build-image-with-podman
      run: |
        podman build -t ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }} -f ${{ matrix.dockerfile_path }} ${{ matrix.container_path }}
    
    # 使用 Podman 登录到 Harbor
    - name: login-to-harbor-with-podman
      run: |
        echo "${{ secrets.ZJ_HARBOR_TOKEN }}" | podman login \
          ${{ env.REGISTRY }} \
          --username ${{ env.USER }} \
          --password-stdin
    
    # 使用 Podman 推送镜像
    - name: push-image-with-podman
      run: |
        podman push ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAMESPACE }}/${{ github.repository }}-${{ matrix.name_suffix }}:v${{ steps.date.outputs.date }}