apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "metadata-environment.roleName" . }}-flink-cleanup-job
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete  
    "helm.sh/hook-weight": "5"   
    "helm.sh/hook-delete-policy": hook-succeeded 
spec:
  template:
    spec:
      containers:
      - name: cleanup-container
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          # check and delete ServiceAccount `flink`
          if kubectl get sa flink -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            echo "Deleting ServiceAccount: flink"
            kubectl delete sa flink -n {{ .Release.Namespace }}
          else
            echo "ServiceAccount `flink` not found"
          fi
          
          # check and delete Role `flink`
          if kubectl get role flink -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            echo "Deleting Role: flink"
            kubectl delete role flink -n {{ .Release.Namespace }}
          else
            echo "Role `flink` not found"
          fi
          
          # check and delete RoleBinding `flink-role-binding`
          if kubectl get rolebinding flink-role-binding -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            echo "Deleting RoleBinding: flink-role-binding"
            kubectl delete rolebinding flink-role-binding -n {{ .Release.Namespace }}
          else
            echo "RoleBinding `flink-role-binding` not found"
          fi

          # check and delete generated RoleBinding `flink-role-binding`
          if kubectl get rolebinding {{ include "metadata-environment.roleName" . }}-flink-role-binding -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            echo "Deleting RoleBinding: {{ include "metadata-environment.roleName" . }}-flink-role-binding"
            kubectl delete rolebinding {{ include "metadata-environment.roleName" . }}-flink-role-binding -n {{ .Release.Namespace }}
          else
            echo "RoleBinding `{{ include "metadata-environment.roleName" . }}-flink-role-binding` not found"
          fi
          
          echo "Cleanup completed successfully"
      restartPolicy: Never
  backoffLimit: 1  