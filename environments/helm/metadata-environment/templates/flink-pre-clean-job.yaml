apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.ingestTaskOperator.name }}-flink-pre-cleanup-job
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete  
    "helm.sh/hook-weight": "5"   
    # "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 1  
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cleanup-container
        {{- if .Values.global.registryPrefix }}
        image: {{ .Values.global.registryPrefix }}/docker.io/bitnami/kubectl:1.28-debian-11
        {{- else }}
        image: docker.io/bitnami/kubectl:1.28-debian-11
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          # check and delete FlinkDeployment 'metadata-flink-job-ingest-kafka-to-es'
          if kubectl get flinkdep metadata-flink-job-ingest-kafka-to-es -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            kubectl delete flinkdep metadata-flink-job-ingest-kafka-to-es -n {{ .Release.Namespace }}
            echo "In Namespace {{ .Release.Namespace }} Deleting Flinkdeployment: metadata-flink-job-ingest-kafka-to-es"
          else
            echo "In Namespace {{ .Release.Namespace }} Flinkdeployment 'metadata-flink-job-ingest-kafka-to-es' not found"
          fi
          # check and delete sesssion job using 'metadata-flink-session-cluster'
          if kubectl get sessionjob -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            kubectl delete sessionjob -n {{ .Release.Namespace }} --all
            echo "In Namespace {{ .Release.Namespace }} Deleting All SessionJobs which hosted by metadata-flink-session-cluster"
          else
            echo "In Namespace {{ .Release.Namespace }}, there is no SessionJob hosted by metadata-flink-session-cluster"
          fi
          # check and delete FlinkDeployment 'metadata-flink-session-cluster'
          if kubectl get flinkdep metadata-flink-session-cluster -n {{ .Release.Namespace }} >/dev/null 2>&1; then
            kubectl delete flinkdep metadata-flink-session-cluster -n {{ .Release.Namespace }}
            echo "In Namespace {{ .Release.Namespace }} Deleting Flinkdeployment: metadata-flink-session-cluster"
          else
            echo "In Namespace {{ .Release.Namespace }} Flinkdeployment 'metadata-flink-session-cluster' not found"
          fi

          echo "Cleanup completed successfully"
      