apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metadata-environment.flink.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
  {{- if or .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true

---

apiVersion:  {{ include "common.capabilities.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ .Values.ingestTaskOperator.flink.clusterRole.name | quote }}
  {{- if not .Values.flinkk8soperator.enabled }}
  namespace: {{ .Values.flinkk8soperator.existingNamespace | quote }}
  {{- else }}
  namespace: {{ .Release.Namespace | quote }}
  {{- end }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
  {{- if or .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
    - "flink.apache.org"
    resources:
    - flinkdeployments
    - flinksessionjobs
    - flinkstatesnapshots
    verbs:
    - get
    - list
    - create
    - watch
    - patch
    - update
  - apiGroups:
    - ""
    resources:
    - pods
    - configmaps
    verbs:
    - get
    - list
    - create
    - watch
    - update
    - patch
    - delete
  - apiGroups:
    - "apps"
    resources:
    - deployments
    verbs:
    - get
    - list
    - create

---

apiVersion:  {{ include "common.capabilities.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.ingestTaskOperator.flink.clusterRoleBinding.name | quote }}
  {{- if not .Values.flinkk8soperator.enabled }}
  namespace: {{ .Values.flinkk8soperator.existingNamespace | quote }}
  {{- else }}
  namespace: {{ .Release.Namespace | quote }}
  {{- end }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
  {{- if or .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.ingestTaskOperator.serviceAccount.annotations .Values.ingestTaskOperator.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.ingestTaskOperator.flink.clusterRole.name | quote }}
subjects:
- kind: ServiceAccount
  name: {{ include "metadata-environment.flink.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}