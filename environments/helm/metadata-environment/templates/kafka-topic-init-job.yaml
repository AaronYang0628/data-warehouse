apiVersion: batch/v1
kind: Job
metadata:
  name: metadata-kafka-topic-init-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    checksum/kafka-config: {{ .Values.kafka | toJson | sha256sum }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-kafka
        {{- if .Values.global.registry }}
        image: {{ .Values.global.registry }}/{{ .Values.initJob.busybox.image }}
        {{- else }}
        image: {{ .Values.initJob.busybox.registry }}/{{ .Values.initJob.busybox.image }}
        {{- end }}
        imagePullPolicy: {{ .Values.initJob.busybox.pullPolicy }}
        command: ['sh', '-c', '
          until nc -z -w 2 {{ .Release.Name }}-kafka.{{ .Release.Namespace }}.svc.cluster.local 9092;
          do
            echo "Waiting for Kafka to be ready...";
            sleep 2;
          done;
          ']
      containers:
      - name: kafka-client
        {{- if .Values.global.registry }}
        image: {{ .Values.global.registry }}/{{ .Values.initJob.kafka.image }}
        {{- else }}
        image: {{ .Values.initJob.kafka.registry }}/{{ .Values.initJob.kafka.image }}
        {{- end }}
        imagePullPolicy: {{ .Values.initJob.kafka.pullPolicy }}
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "{{ .Release.Name }}-kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
          - name: OPERATION
            value: "create"
          - name: TOPIC_NAME
            value: "ingest-to-es"
          - name: PARTITIONS
            value: "16"
          - name: RETENTION_MS
            value: "259200000"
          - name: REPLICATION_FACTOR
            value: {{ .Values.kafka.replicationFactor | quote }}
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e

            echo "=========================================="
            echo "Kafka Topic Initialization"
            echo "=========================================="
            echo "Bootstrap Servers: $KAFKA_BOOTSTRAP_SERVERS"
            echo "Topic: $TOPIC_NAME"
            echo ""

            # Check if topic already exists
            echo "Checking if topic '$TOPIC_NAME' exists..."
            if kafka-topics.sh --list --bootstrap-server $KAFKA_BOOTSTRAP_SERVERS | grep -q "^${TOPIC_NAME}$"; then
              echo "✓ Topic '$TOPIC_NAME' already exists"
              echo "  Skipping creation"
              exit 0
            fi

            echo "Topic does not exist, creating..."
            echo ""

            # Create topic with retry logic
            MAX_RETRIES=3
            RETRY_COUNT=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if kafka-topics.sh --create \
                --bootstrap-server $KAFKA_BOOTSTRAP_SERVERS \
                --topic $TOPIC_NAME \
                --partitions $PARTITIONS \
                --replication-factor $REPLICATION_FACTOR \
                --config retention.ms=$RETENTION_MS \
                --if-not-exists; then
                echo ""
                echo "✓ Topic '$TOPIC_NAME' created successfully"
                echo "  Partitions: $PARTITIONS"
                echo "  Replication Factor: $REPLICATION_FACTOR"
                echo "  Retention: $RETENTION_MS ms"
                exit 0
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⚠️  Creation attempt $RETRY_COUNT failed, retrying in 5s..."
                  sleep 5
                fi
              fi
            done

            echo "✗ Failed to create topic after $MAX_RETRIES attempts"
            exit 1