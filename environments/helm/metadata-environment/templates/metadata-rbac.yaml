---
# ClusterRole - 集群级别权限
apiVersion: {{ include "common.capabilities.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ include "metadata-environment.clusterRoleName" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
rules:
  # Flink resources
  - apiGroups:
    - "flink.apache.org"
    resources:
    - flinkdeployments
    - flinksessionjobs
    - flinkstatesnapshots
    verbs:
    - get
    - list
    - create
    - watch
    - patch
    - delete
    - update
  
  # ConfigMaps, Secrets, PV, PVC
  - apiGroups:
    - ""
    resources:
    - configmaps
    - secrets
    - persistentvolumes
    - persistentvolumeclaims
    verbs:
    - create
    - get
    - delete
    - watch
    - list
    - update
    - patch
  
  # CronJobs
  - apiGroups:
    - "batch"
    resources:
    - cronjobs
    verbs:
    - create
    - get
    - delete
    - watch
    - list
    - patch
    - update
  
  # CRDs
  - apiGroups:
    - apiextensions.k8s.io
    resources:
    - customresourcedefinitions
    verbs:
    - get
    - list
    - watch
    - create
  
  # Custom CRDs
  - apiGroups:
    - org.zhejianglab.astro.metadata
    resources:
    - flinkingesttasks
    - virtualingesttasks
    - croningesttasks
    - flinkingesttasks/status
    - croningesttasks/status
    - virtualingesttasks/status
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  
  # Namespaces - 只读
  - apiGroups:
    - ""
    resources:
    - namespaces
    verbs:
    - get
    - list
    - watch
  
  # Deployments - 用于检查状态（可选）
  - apiGroups:
    - "apps"
    resources:
    - deployments
    verbs:
    - get
    - list

{{- $namespaces := list .Release.Namespace }}
{{- if .Values.flink.session.clusterNamespaces }}
{{- $namespaces = concat $namespaces .Values.flink.session.clusterNamespaces | uniq }}
{{- end }}

{{- range $namespace := $namespaces }}
---
# ServiceAccount - 每个命名空间
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metadata-environment.serviceAccountName" $ }}
  namespace: {{ $namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
automountServiceAccountToken: {{ $.Values.ingestTaskOperator.automountServiceAccountToken }}

---
# Role - 命名空间级别权限
apiVersion: {{ include "common.capabilities.rbac.apiVersion" $ }}
kind: Role
metadata:
  name: {{ include "metadata-environment.roleName" $ }}
  namespace: {{ $namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
rules:
  # Pods, ConfigMaps, Secrets
  - apiGroups:
    - ""
    resources:
    - configmaps
    - secrets
    - namespaces
    - pods
    verbs:
    - create
    - get
    - delete
    - watch
    - list
    - patch
    - update
  
  # Pod exec
  - apiGroups:
    - ""
    resources:
    - pods/exec
    verbs:
    - create
  
  # Deployments
  - apiGroups:
    - "apps"
    resources:
    - deployments
    verbs:
    - get
    - list
    - create
    - delete
  
  # Jobs
  - apiGroups:
    - "batch"
    resources:
    - jobs
    verbs:
    - create
    - get
    - delete
    - list
    - watch
  
  # CronJobs
  - apiGroups:
    - "batch"
    resources:
    - cronjobs
    verbs:
    - create
    - get
    - delete
    - watch
    - list
    - patch
    - update
  
  # Custom CRDs
  - apiGroups:
    - org.zhejianglab.astro.metadata
    resources:
    - flinkingesttasks
    - virtualingesttasks
    - croningesttasks
    - flinkingesttasks/status
    - croningesttasks/status
    - virtualingesttasks/status
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  
  # Flink resources - namespace 级别
  - apiGroups:
    - "flink.apache.org"
    resources:
    - flinkdeployments
    - flinksessionjobs
    - flinkstatesnapshots
    verbs:
    - get
    - list
    - create
    - watch
    - patch
    - delete
    - update

---
# RoleBinding
apiVersion: {{ include "common.capabilities.rbac.apiVersion" $ }}
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" $.Values.ingestTaskOperator.serviceAccount.roleBinding.name $namespace | quote }}
  namespace: {{ $namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    namespace: {{ $namespace | quote }}
    name: {{ include "metadata-environment.serviceAccountName" $ }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "metadata-environment.roleName" $ }}

---
# ClusterRoleBinding
apiVersion:  {{ include "common.capabilities.rbac.apiVersion" $ }}
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $.Values.ingestTaskOperator.serviceAccount.clusterRoleBinding.name $namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.ingestTaskOperator.commonLabels "context" $ ) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "metadata-environment.serviceAccountName" $ }}
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "metadata-environment.clusterRoleName" $ }}
{{- end }}