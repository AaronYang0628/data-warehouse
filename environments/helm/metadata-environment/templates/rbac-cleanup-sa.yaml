---
# ServiceAccount for RBAC cleanup job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-rbac-cleanup-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": "post-delete"
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": "before-hook-creation"

---
# ClusterRole for RBAC cleanup job
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-rbac-cleanup
  annotations:
    "helm.sh/hook": "post-delete"
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": "before-hook-creation"
rules:
# Delete ClusterRoles
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  verbs: ["delete", "get"]
# Delete ClusterRoleBindings
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["delete", "get"]
# Delete Roles
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["delete", "get"]
# Delete RoleBindings
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["delete", "get"]
# Delete ServiceAccounts
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["delete", "get"]
# Delete Secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["delete", "get"]
# Delete CRDs
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["delete", "get"]

---
# ClusterRoleBinding for RBAC cleanup job
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-rbac-cleanup
  annotations:
    "helm.sh/hook": "post-delete"
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": "before-hook-creation"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-rbac-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-rbac-cleanup-sa
  namespace: {{ .Release.Namespace }}
