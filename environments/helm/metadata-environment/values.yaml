global:
  storageClass: "" 
  registry: m.lab.zverse.space/docker.io
  pullPolicy: IfNotPresent
  security: 
    allowInsecureImages: true

elasticsearch:
  enabled: true
  global:
    kibanaEnabled: true
  clusterName: elastic
  image:
    registry: m.lab.zverse.space/docker.io
    pullPolicy: IfNotPresent
  security:
    enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: self-signed-ca-issuer
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    hostname: elastic-search.dev.tech
    ingressClassName: nginx
    path: /?(.*)
    tls: true
  master:
    masterOnly: false
    replicaCount: 1
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 1
        memory: 2048Mi
      limits:
        cpu: 2
        memory: 4096Mi
    heapSize: 2g
  data:
    replicaCount: 0
    persistence:
      enabled: false
  coordinating:
    replicaCount: 0
  ingest:
    enabled: true
    replicaCount: 0
    service:
      enabled: false
      type: ClusterIP
    ingress:
      enabled: false
  metrics:
    enabled: false
    image:
      registry: m.lab.zverse.space/docker.io
      pullPolicy: IfNotPresent
  volumePermissions:
    enabled: false
    image:
      registry: m.lab.zverse.space/docker.io
      pullPolicy: IfNotPresent
  sysctlImage:
    enabled: true
    registry: m.lab.zverse.space/docker.io
    pullPolicy: IfNotPresent
  kibana:
    elasticsearch:
      hosts:
        - '{{ include "elasticsearch.service.name" . }}'
      port: '{{ include "elasticsearch.service.ports.restAPI" . }}'
  esJavaOpts: "-Xmx2g -Xms2g"


kafka:
  enabled: true
  image:
    registry: m.lab.zverse.space/docker.io
  controller:
    replicaCount: 1
    persistence:
      enabled: false
    logPersistence:
      enabled: false
    extraConfig: |
      message.max.bytes=5242880
      default.replication.factor=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
  broker:
    replicaCount: 0
    persistence:
      enabled: false
    logPersistence:
      enabled: false
    extraConfig: |
      message.max.bytes=5242880
      default.replication.factor=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
  externalAccess:
    enabled: false
    autoDiscovery:
      enabled: false
      image:
        registry: m.lab.zverse.space/docker.io
  volumePermissions:
    enabled: false
    image:
      registry: m.lab.zverse.space/docker.io
  metrics:
    kafka:
      enabled: false
      image:
        registry: m.lab.zverse.space/docker.io
    jmx:
      enabled: false
      image:
        registry: m.lab.zverse.space/docker.io
  provisioning:
    enabled: false
  kraft:
    enabled: true
  zookeeper:
    enabled: false

flink:
  enabled: true

