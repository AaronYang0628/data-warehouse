apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-warehouse-bundle
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: warehouse
  source:
    repoURL: harbor.zhejianglab.com/ay-dev
    chart: data-warehouse
    targetRevision: 0.0.20
    helm:
      releaseName: data-warehouse-bundle
      passCredentials: true
      values: |
        global:
          storageClass: "" 
          registry: m.lab.zverse.space/docker.io
          pullPolicy: IfNotPresent
          security: 
            allowInsecureImages: true

        resourcesPreset: "nano"

        ingestTaskOperator:
          enabled: true
          name: ingest-operator
          commonLabels: {}
          commonAnnotations: {}
          image:
            registry: harbor.zhejianglab.com
            repository: ay-dev/metadata-crd-operator-dev
            tag: v20250919
            pullPolicy: Always
            pullSecrets: []
          serviceAccount:
            annotations: {}
            name: "metadata-ingest-operator-sa"
            role:
              name: "metadata-ingest-operator-role"
            roleBinding:
              name: "metadata-ingest-operator-rb"
            clusterRole:
              name: "metadata-ingest-operator-crole"
            clusterRoleBinding:
              name: "metadata-ingest-operator-crb"
          flink:
            serviceAccount:
              name: "metadata-ingest-flink-sa"
            clusterRole:
              name: "metadata-ingest-flink-crole"
            clusterRoleBinding:
              name: "metadata-ingest-flink-crole-crb"
          automountServiceAccountToken: true
          podLabels: {}
          affinity: {}
          podAnnotations: {}
          podAffinityPreset: ""
          podAntiAffinityPreset: soft
          nodeAffinityPreset:
            type: ""
            key: ""
            values: []
          hostNetwork: false
          dnsPolicy: ""
          dnsConfig: {}
          hostIPC: false
          priorityClassName: ""
          nodeSelector: {}
          tolerations: []
          schedulerName: ""
          topologySpreadConstraints: []
          podSecurityContext:
            enabled: true
            fsGroupChangePolicy: Always
            supplementalGroups: []
            fsGroup: 0
          terminationGracePeriodSeconds: ""
          hostAliases: []
          command: []
          args: []
          diagnosticMode:
            enabled: false
            command: ["tail", "-f", "/etc/hosts"]
            args: []
          extraEnvVars: []
          extraEnvVarsCM: ""
          extraEnvVarsSecret: ""
          revisionHistoryLimit: 10
          updateStrategy:
            type: RollingUpdate
            rollingUpdate: {}
          lifecycleHooks: {}
          resources: 
            limits:
              cpu: 2
              ephemeral-storage: 8Gi
              memory: 2Gi
            requests:
              cpu: 1
              ephemeral-storage: 8Gi
              memory: 1Gi
          extraVolumes: []
          extraVolumeMounts: []
          livenessProbe:
            enabled: false
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          startupProbe:
            enabled: false
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          readinessProbe:
            enabled: false
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          service:
            name: healthz
            healthz:
              type: ClusterIP
              port: 8099
              targetPort: 8099

        certManager:
          enabled: false
          installCRDs: false
          image:
            repository: m.daocloud.io/quay.io/jetstack/cert-manager-controller
          webhook:
            image:
              repository: m.daocloud.io/quay.io/jetstack/cert-manager-webhook
          cainjector:
            image:
              repository: m.daocloud.io/quay.io/jetstack/cert-manager-cainjector
          acmesolver:
            image:
              repository: m.daocloud.io/quay.io/jetstack/cert-manager-acmesolver
          startupapicheck:
            image:
              repository: m.daocloud.io/quay.io/jetstack/cert-manager-startupapicheck

        flinkk8soperator:
          enabled: false
          image:
            repository: m.lab.zverse.space/ghcr.io/apache/flink-kubernetes-operator
            tag: 1.11.0
          defaultConfiguration:
            create: true
            append: true
            flink-conf.yaml: |+
              kubernetes.operator.flink.client.timeout: 120 s
          existingNamespace: flink

        flink:
          session:
            version: v1_19
            mode: native
            image:
              registry: docker-registry.lab.zverse.space
              repository: astro-base-images/flink-oss-updated
              tag: 1.19-java17
              pullSecrets: []
            clusterNamespaces:
            - astro-workbench
            state:
              shuffle:
                path: /opt/flink/shuffle-data
            extraContainerPorts:
              - name: flink-metric
                containerPort: 9249
                protocol: TCP
            jobManager:
              replicas: 1
              resource:
                cpu: 2
                memory: 16Gi
            taskManager:
              replicas: 8
              taskSlots: 3
              resource:
                cpu: 2
                memory: 12Gi
            ingress:
              enabled: true
              annotations:
                cert-manager.io/cluster-issuer: self-signed-ca-issuer
                nginx.ingress.kubernetes.io/rewrite-target: /$1
              className: nginx
              template: flink.session.metadata.dev.lab.zverse.space/{{namespace}}/{{name}}/?(.*)
            persistence:
              enabled: true
              accessModes:
                - ReadWriteMany
              size: 100Gi
              storageClass: "juicefs-tidb-oss"
          residenceJobs:
            consumeKafkaToES:
              enabled: true
              name: ingest-kafka-to-es
              version: v1_19
              mode: native
              image: 
                registry: docker-registry.lab.zverse.space  
                repository: data-and-computing-dev/ingest-to-es-transfer
                tag: v20250929.0
                pullSecrets: []
              extraContainerPorts:
              - name: flink-metric
                containerPort: 9249
                protocol: TCP
              extraEnvVars: []
              jobManager:
                replicas: 1
                resource:
                  cpu: 2
                  memory: 4Gi
              taskManager:
                replicas: 8
                taskSlots: 2
                resource:
                  cpu: 1
                  memory: 4Gi
              ingress:
                enabled: true
                annotations:
                  cert-manager.io/cluster-issuer: self-signed-ca-issuer
                  nginx.ingress.kubernetes.io/rewrite-target: /$1
                className: nginx
                template: flink.job.metadata.dev.lab.zverse.space/{{namespace}}/{{name}}/?(.*)
              job:
                jarURI: local:///app/flink-application.jar
                parallelism: 16
                entryClass: com.zhejianglab.astronomy.es.IngestToEs
                args: []  
            
        minio:
          image:
            registry: m.lab.zverse.space/docker.io
          clientImage:
            registry: m.lab.zverse.space/docker.io
          auth:
            existingSecret: metadata-minio-secret
          defaultBuckets: "es-snapshot"
          ingress:
            enabled: true
            ingressClassName: "nginx"
            hostname: minio-console.metadata.dev.lab.zverse.space
            path: /?(.*)
            pathType: ImplementationSpecific
            annotations: 
              nginx.ingress.kubernetes.io/rewrite-target: /$1
            tls: true
            selfSigned: true
            extraHosts: []
          apiIngress:
            enabled: true
            ingressClassName: "nginx"
            hostname: minio-api.metadata.dev.lab.zverse.space
            path: /?(.*)
            pathType: ImplementationSpecific
            annotations: 
              nginx.ingress.kubernetes.io/rewrite-target: /$1
          persistence:
            enabled: true
            storageClass: "juicefs-tidb-oss"
            accessModes:
              - ReadWriteMany
            size: 20Gi
          volumePermissions:
            enabled: false
            image:
              registry: m.lab.zverse.space/docker.io
          metrics:
            prometheusAuthType: public
            enabled: false
            serviceMonitor:
              enabled: false
              namespace: "monitor"
              labels:
                release: kube-prometheus-stack
              jobLabel: "metadata-minio"
              interval: 30s
            prometheusRule:
              enabled: false
              namespace: "monitor"
              additionalLabels:
                release: kube-prometheus-stack

        elasticsearch:
          global:
            kibanaEnabled: true
          clusterName: elastic
          image:
            registry: m.lab.zverse.space/docker.io
            pullPolicy: IfNotPresent
          security:
            enabled: false
          service:
            type: ClusterIP
          extraConfig:
            s3:
              client:
                default:
                  protocol: http
                  endpoint: 'http://minio-api.metadata.dev'
                  path_style_access: true
          initScripts:
            configure-s3-client.sh: |
              elasticsearch_set_key_value "s3.client.default.access_key" "${S3_ACCESSKEY}"
              elasticsearch_set_key_value "s3.client.default.secret_key" "${S3_SECRETKEY}"
          extraEnvVars:
          - name: S3_ACCESSKEY
            valueFrom:
              secretKeyRef:
                key: s3-access-key
                name: metadata-minio-secret
          - name: S3_SECRETKEY
            valueFrom:
              secretKeyRef:
                key: s3-access-secret
                name: metadata-minio-secret
          ingress:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: self-signed-ca-issuer
              nginx.ingress.kubernetes.io/rewrite-target: /$1
            hostname: elastic-search.metadata.dev.lab.zverse.space
            ingressClassName: nginx
            path: /?(.*)
            tls: false
          master:
            masterOnly: false
            replicaCount: 3
            persistence:
              enabled: false
              storageClass: ""
              size: 30Gi
            resources:
              requests:
                cpu: 2
                memory: 4Gi
              limits:
                cpu: 4
                memory: 8Gi
            heapSize: 3g
          data:
            replicaCount: 5
            persistence:
              enabled: true
              storageClass: "juicefs-tidb-oss"
              accessModes:
                - ReadWriteMany
              size: 200Gi
            resources:
              requests:
                cpu: 2
                memory: 8Gi
              limits: 
                cpu: 6
                memory: 12Gi
            heapSize: 6g
          coordinating:
            replicaCount: 0
          ingest:
            enabled: false
          metrics:
            enabled: false
            image:
              registry: m.lab.zverse.space/docker.io
              pullPolicy: IfNotPresent
          volumePermissions:
            enabled: false
            image:
              registry: m.lab.zverse.space/docker.io
              pullPolicy: IfNotPresent
          sysctlImage:
            enabled: true
            registry: m.lab.zverse.space/docker.io
            pullPolicy: IfNotPresent
          kibana:
            elasticsearch:
              hosts:
                - '{{ include "elasticsearch.service.name" . }}'
              port: '{{ include "elasticsearch.service.ports.restAPI" . }}'
            image:
              registry: m.lab.zverse.space/docker.io
              pullPolicy: IfNotPresent
            persistence:
              enabled: false
            ingress:
              enabled: true
              annotations:
                cert-manager.io/cluster-issuer: self-signed-ca-issuer
                nginx.ingress.kubernetes.io/rewrite-target: /$1
              hostname: kibana.metadata.dev.lab.zverse.space
              ingressClassName: nginx
              path: /?(.*)
              tls: false

        kafka:
          replicationFactor: 1
          image:
            registry: m.lab.zverse.space/docker.io
          listeners:
            client:
              protocol: PLAINTEXT
            interbroker:
              protocol: PLAINTEXT
          controller:
            replicaCount: 3
            persistence:
              enabled: false
              storageClass: ""
              size: 20Gi
            logPersistence:
              enabled: false
            livenessProbe:
              failureThreshold: 8
            heapOpts: -Xmx3500m -Xms512m
            resources:
              requests:
                cpu: 1
                memory: 2Gi
              limits:
                cpu: 2
                memory: 4Gi
            extraConfig: |
              message.max.bytes=5242880
              default.replication.factor=1
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
          broker:
            replicaCount: 5
            minId: 100
            persistence:
              enabled: true
              storageClass: "juicefs-tidb-oss"
              accessModes:
                - ReadWriteMany
              size: 200Gi
            logPersistence:
              enabled: false
            livenessProbe:
              failureThreshold: 8
            heapOpts: -Xmx3500m -Xms512m
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits: 
                cpu: 2
                memory: 4Gi
            extraConfig: |
              message.max.bytes=5242880
              default.replication.factor=1
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
          externalAccess:
            enabled: false
            autoDiscovery:
              enabled: false
              image:
                registry: m.lab.zverse.space/docker.io
          volumePermissions:
            enabled: false
            image:
              registry: m.lab.zverse.space/docker.io
          metrics:
            kafka:
              enabled: false
              image:
                registry: m.lab.zverse.space/docker.io
            jmx:
              enabled: false
              image:
                registry: m.lab.zverse.space/docker.io
          provisioning:
            enabled: false
          kraft:
            enabled: true
            clusterId: "1"

        apiServer:
          name: metadata-api-server
          commonLabels: {}
          commonAnnotations: {}
          serviceAccount:
            name: metadata-api-server-sa
          clusterRole:
            name: metadata-api-server-crole
            roleBinding: 
              name: metadata-api-server-crb
          image:
            registry: docker-registry.lab.zverse.space
            repository: data-and-computing-dev/meta-data
            tag: 1.0.7
            pullPolicy: Always
            pullSecrets: []
          automountServiceAccountToken: true
          podLabels: {}
          affinity: {}
          podAnnotations: {}
          podAffinityPreset: ""
          podAntiAffinityPreset: soft
          nodeAffinityPreset:
            type: ""
            key: ""
            values: []
          hostNetwork: false
          dnsPolicy: ""
          dnsConfig: {}
          hostIPC: false
          priorityClassName: ""
          nodeSelector: {}
          tolerations: []
          schedulerName: ""
          topologySpreadConstraints: []
          podSecurityContext:
            enabled: true
            fsGroupChangePolicy: Always
            supplementalGroups: []
            fsGroup: 0
          terminationGracePeriodSeconds: ""
          hostAliases: []
          command: []
          args: []
          diagnosticMode:
            enabled: false
            command: ["tail", "-f", "/etc/hosts"]
            args: []
          extraEnvVars: []
          extraEnvVarsCM: ""
          extraEnvVarsSecret: ""
          revisionHistoryLimit: 10
          updateStrategy:
            type: RollingUpdate
            rollingUpdate: {}
          lifecycleHooks: {}
          resources: 
            limits:
              cpu: 2
              ephemeral-storage: 8Gi
              memory: 2Gi
            requests:
              cpu: 1
              ephemeral-storage: 8Gi
              memory: 1Gi
          extraVolumes: []
          extraVolumeMounts: []
          livenessProbe:
            enabled: false
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          startupProbe:
            enabled: false
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          readinessProbe:
            enabled: false
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1