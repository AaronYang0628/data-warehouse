kubectl -n warehouse apply -f - <<EOF
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flink-ingest-cron
spec:
  schedule: "*/1 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: metadata-ingest-flink-sa 
          restartPolicy: Never
          containers:
            - name: submit-flink-ingest-task
              image: m.daocloud.io/docker.io/bitnami/kubectl:1.28-debian-11
              command:
                - /bin/sh
                - -c
                - |
                  cat <<EOF | kubectl apply -f -
                  apiVersion: org.zhejianglab.astro.metadata/v1
                  kind: FlinkIngestTask
                  metadata:
                    name: ingest-fits-from-s3-$(date +%s)
                  spec:
                    path: "s3://csst-prod/CSST_L0/MSC/SCI/60310/10100000006/MS"
                    tags:
                      - CRAFTS_SPECTRUM_ORIGINAL
                      - FAST
                    userProperties:
                      key1: "value1"
                      key2: "1231"
                      key3: "true"
                    allowedSuffixes:
                      - fits
                    platform: s3
                    jobParallelism: 2
                    extraSecret: 
                      name: munge-oss-crediential
                      accessKeyName: access-key
                      secretKeyName: secret-key
                      endpointKeyName: s3-endpoint
                  EOF
EOF

